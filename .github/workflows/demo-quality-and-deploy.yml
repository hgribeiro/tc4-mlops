name: Demo quality and deploy

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "data/golden_set/**"
      - "artifacts/official-experiment/**"
      - "presentation/**"
      - "infrastructure/**"
      - "scripts/**"
      - "Dockerfile*"
      - "pyproject.toml"
      - ".github/workflows/demo-quality-and-deploy.yml"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      low_quota_mode:
        description: "Keep true while this account has Lambda concurrent-execution quota 10"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

# The workflow has no repository secrets or AWS access keys. Each AWS job gets
# short-lived credentials through the exact GitHub OIDC subject trusted by AWS.
permissions:
  contents: read

concurrency:
  group: demo-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: software, evidence, deck and Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip && python -m pip install '.[test]'
      - name: Python test suite
        run: PYTHONPATH=src python -m pytest
      - name: Golden Set
        run: >-
          PYTHONPATH=src python -m responsible_next_step evaluate-golden-set
          --input data/golden_set/evaluation_cases.jsonl
          --audit-log-dir /tmp/tc4-golden-set
      - name: Official evidence and provenance
        run: >-
          PYTHONPATH=src python -m responsible_next_step validate-experiment-artifacts
          --artifact-dir artifacts/official-experiment
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: presentation/package-lock.json
      - name: Presentation build and browser tests
        working-directory: presentation
        run: npm ci && npx playwright install --with-deps chromium && npm test
      - name: Docker Lambda build
        run: docker build --platform linux/amd64 -f Dockerfile.lambda -t tc4-mlops-demo:${{ github.sha }} .
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.3"
          terraform_wrapper: false
      - name: Terraform format, validate and security tests
        run: |
          terraform fmt -check -recursive
          for directory in infrastructure/environments/bootstrap infrastructure/environments/demo; do
            terraform -chdir="$directory" init -backend=false
            terraform -chdir="$directory" validate
            terraform -chdir="$directory" test
          done

  plan:
    name: non-mutating demo Terraform plan
    needs: quality
    # The plan trust policy accepts only pull requests and refs/heads/main.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.3"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::969212888717:role/tc4-mlops-github-plan
          aws-region: us-east-1
          role-session-name: tc4-demo-plan
      - name: Verify OIDC identity and plan without refresh
        env:
          COMMIT_SHA: ${{ github.sha }}
          LOW_QUOTA_MODE: "true"
        run: |
          aws sts get-caller-identity --query Account --output text | grep -x '969212888717'
          scripts/plan-demo-aws.sh

  deploy:
    name: approved demo deployment
    needs: [quality, plan]
    # Merging the reviewed PR is the human approval surface. The resulting main
    # push deploys automatically; dispatch remains available for an explicit
    # main-only rerun. PRs and develop never deploy. The demo environment keeps
    # the OIDC subject environment:demo and its custom main-only branch policy.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Shared with the teardown workflow so deployment and destroy cannot race.
    concurrency:
      group: tc4-mlops-demo-lifecycle
      cancel-in-progress: false
    environment:
      name: demo
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: presentation/package-lock.json
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.3"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::969212888717:role/tc4-mlops-github-deploy
          aws-region: us-east-1
          role-session-name: tc4-demo-deploy
      - name: Deploy, publish and smoke test
        env:
          COMMIT_SHA: ${{ github.sha }}
          LOW_QUOTA_MODE: ${{ inputs.low_quota_mode || 'true' }}
        run: |
          aws sts get-caller-identity --query Account --output text | grep -x '969212888717'
          scripts/deploy-demo-aws.sh
