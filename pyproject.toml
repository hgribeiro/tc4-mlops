[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "responsible-next-step-lab"
version = "0.1.0"
description = "Laboratório demonstrável de Próximo Passo Responsável em Empréstimos com Garantia sintéticos."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "mangum>=0.19,<1",
    "mlflow>=2.12,<4",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
]

[project.scripts]
responsible-next-step = "responsible_next_step.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
responsible_next_step = ["demo_assets.json"]
